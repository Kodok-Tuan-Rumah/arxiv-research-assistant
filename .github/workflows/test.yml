name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: arxiv
          POSTGRES_PASSWORD: arxiv_secret
          POSTGRES_DB: arxiv_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go-backend/go.sum

      - name: Run migrations
        run: |
          PGPASSWORD=arxiv_secret psql -h localhost -U arxiv -d arxiv_db -f infra/postgres/init.sql
          PGPASSWORD=arxiv_secret psql -h localhost -U arxiv -d arxiv_db -f go-backend/migrations/003_versioning.up.sql

      - name: Go Build
        working-directory: go-backend
        run: go build ./...

      - name: Go Test
        working-directory: go-backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: arxiv
          DB_PASSWORD: arxiv_secret
          DB_NAME: arxiv_db
        run: go test ./... -v -timeout 60s

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            python-ml/requirements.txt
            python-ml/requirements-dev.txt

      - name: Install dependencies
        working-directory: python-ml
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Python Test
        working-directory: python-ml
        run: python -m pytest tests/ -v --timeout=60

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real Groq keys in tracked files
        run: |
          if grep -rqE 'gsk_[A-Za-z0-9]{30,}' --exclude-dir=.git .; then
            echo "::error::Real-looking Groq key found in tracked files!"; exit 1
          fi
          echo "clean ✓"
