name: CI

on:
  push:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]
  pull_request:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test
        run: |
          cd go-backend
          go test ./... -v

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd python-ml
          pip install -r requirements.txt
      - name: Test
        run: |
          cd python-ml
          PYTHONPATH=. pytest tests/ -v