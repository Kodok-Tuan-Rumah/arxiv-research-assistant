name: Lint

on:
  push:
    branches: [master, main, remediation/2026-10-24, "remediation/**"]
  pull_request:
    branches: [master, main, remediation/2026-10-24, "remediation/**"]

jobs:
  lint-go:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go-backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: "v1.61.0"
          working-directory: go-backend

  lint-python:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.17.0"

      - name: Ruff lint
        working-directory: python-ml
        run: ruff check . --ignore E501,F401
