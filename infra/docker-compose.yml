services:
  postgres:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: arxiv-postgres
    environment:
      POSTGRES_USER: arxiv
      POSTGRES_PASSWORD: arxiv_secret
      POSTGRES_DB: arxiv_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiv -d arxiv_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arxiv-net

  qdrant:
    image: qdrant/qdrant:latest@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    container_name: arxiv-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arxiv-net

  ollama:
    image: ollama/ollama:latest@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    container_name: arxiv-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/11434'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arxiv-net

  python-ml:
    build:
      context: ../python-ml
      dockerfile: Dockerfile
    container_name: arxiv-python-ml
    ports:
      - "8001:8001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arxiv
      DB_PASSWORD: arxiv_secret
      DB_NAME: arxiv_db
      QDRANT_URL: http://qdrant:6333
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ollama
      GROQ_MODEL: openai/gpt-oss-20b
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arxiv-net

  go-backend:
    build:
      context: ../go-backend
      dockerfile: Dockerfile
    container_name: arxiv-go-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: arxiv
      DB_PASSWORD: arxiv_secret
      DB_NAME: arxiv_db
      ML_SERVICE_URL: http://python-ml:8001
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      python-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - arxiv-net

  prometheus:
    image: prom/prometheus:latest@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: arxiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - arxiv-net

  grafana:
    image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: arxiv-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - arxiv-net

networks:
  arxiv-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  ollama_data:
